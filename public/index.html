<!doctype html>
<html lang="es-AR" data-mode="light" data-palette="violet">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TRADEX · Gestión</title>
  <meta name="theme-color" content="#8b3dff" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Inicio</h1>
          <div class="sub" id="page-sub"></div>
        </div>
        <div class="actions" id="topbar-actions"></div>
        <button class="btn icon bell-top" id="bell-top" title="Para hacer hoy" aria-label="Tareas de hoy"></button>
        <a class="btn settings-top" id="settings-top" href="#/ajustes" title="Ajustes"></a>
        <button class="btn icon mode-top" id="mode-top" title="Modo claro / oscuro" aria-label="Cambiar modo claro u oscuro"></button>
      </header>
      <section class="content" id="view"></section>
    </main>
    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <button class="fab" id="fab" title="Hablar con Dex (asistente)" aria-label="Abrir asistente"></button>
  <div id="assistant-root"></div>
  <div id="modal-root"></div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
